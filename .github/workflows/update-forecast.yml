name: Daily NWP Forecast & Date Sync

on:
  schedule:
    # Runs every day at 18:30 UTC (00:00 midnight IST)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML dependencies
        run: |
          pip install requests pandas numpy scikit-learn

      - name: Run Live NWP Forecast Pipeline
        run: |
          python ml/live_nwp_forecast.py

      - name: Commit and push updated forecast data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "Auto-update live forecast & timeline dates [skip ci]" || exit 0
          git push
