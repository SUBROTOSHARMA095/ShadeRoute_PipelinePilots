name: Daily NWP Forecast & Date Sync

on:
  schedule:
    # Runs twice daily to keep Vercel deployments fresh with current forecasts
    - cron: '30 18 * * *'   # 00:00 midnight IST (18:30 UTC)
    - cron: '30 0 * * *'    # 06:00 AM IST (00:30 UTC)
  workflow_dispatch: {}

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: [main, beta]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy scikit-learn==1.8.0

      - name: Run Live NWP Forecast Pipeline
        run: python ml/live_nwp_forecast.py

      - name: Commit and push updated forecast data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No forecast changes detected in public/data/ to commit."
          else
            echo "Staged changes detected in public/data/. Committing and pushing..."
            git commit -m "Auto-update live forecast & timeline dates [skip ci]"
            git pull --rebase origin ${{ matrix.branch }}
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ matrix.branch }}
            echo "Successfully updated and pushed forecast data to ${{ matrix.branch }}"
          fi

      - name: Trigger Vercel redeploy
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_MAIN: ${{ secrets.VERCEL_DEPLOY_HOOK_MAIN }}
          VERCEL_DEPLOY_HOOK_BETA: ${{ secrets.VERCEL_DEPLOY_HOOK_BETA }}
        run: |
          HOOK_URL=""
          if [ "${{ matrix.branch }}" = "main" ]; then
            HOOK_URL="$VERCEL_DEPLOY_HOOK_MAIN"
          elif [ "${{ matrix.branch }}" = "beta" ]; then
            HOOK_URL="$VERCEL_DEPLOY_HOOK_BETA"
          fi

          if [ -n "$HOOK_URL" ]; then
            curl -s -X POST "$HOOK_URL"
            echo "Triggered Vercel redeploy for ${{ matrix.branch }} branch"
          else
            echo "Vercel deploy hook for ${{ matrix.branch }} is not set. To enable auto-redeploy, add VERCEL_DEPLOY_HOOK_MAIN and VERCEL_DEPLOY_HOOK_BETA in GitHub Repo Settings -> Secrets and variables -> Actions."
          fi

