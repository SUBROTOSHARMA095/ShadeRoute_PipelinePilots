name: Daily NWP Forecast & Date Sync (Beta)

on:
  schedule:
    # Runs twice daily to keep Vercel deployments fresh with current forecasts
    - cron: '30 18 * * *'   # 00:00 midnight IST (18:30 UTC)
    - cron: '30 0 * * *'    # 06:00 AM IST (00:30 UTC)
  workflow_dispatch: {}

jobs:
  update-forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: beta

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ML dependencies
        run: pip install requests pandas numpy scikit-learn

      - name: Run Live NWP Forecast Pipeline
        run: python ml/live_nwp_forecast.py

      - name: Commit and push updated forecast data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git commit -m "Auto-update live forecast & timeline dates [skip ci]" || exit 0
          git push origin beta

      - name: Trigger Vercel redeploy
        if: success()
        env:
          VERCEL_DEPLOY_HOOK_BETA: ${{ secrets.VERCEL_DEPLOY_HOOK_BETA }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_BETA" ]; then
            curl -s -X POST "$VERCEL_DEPLOY_HOOK_BETA"
            echo "Triggered Vercel redeploy for beta branch"
          else
            echo "Vercel deploy hook for beta is not set. To enable auto-redeploy, add VERCEL_DEPLOY_HOOK_BETA in GitHub Repo Settings -> Secrets and variables -> Actions."
          fi

